<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curadoria de fotos - Duda Salvados</title>
    <link rel="stylesheet" href="/admin/photos.css" />
  </head>
  <body>
    <header>
      <div>
        <p>Admin local</p>
        <h1>Curadoria de fotos</h1>
      </div>
      <button id="save">Salvar escolhas</button>
    </header>

    <main>
      <aside>
        <input id="search" type="search" placeholder="Buscar codigo ou produto" />
        <label><input id="missing" type="checkbox" /> Apenas sem foto</label>
        <nav id="list"></nav>
      </aside>
      <section id="editor">
        <p class="empty">Selecione um produto.</p>
      </section>
    </main>

    <script src="/admin/photos.js" type="module"></script>
  </body>
</html>
