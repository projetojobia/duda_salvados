<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curadoria de fotos - Duda Salvados</title>
    <link rel="stylesheet" href="/admin/photos.css" />
  </head>
  <body>
    <header>
      <div>
        <p>Admin local</p>
        <h1>Curadoria de fotos</h1>
      </div>
    </header>

    <section class="work-actions" aria-label="Acoes da curadoria">
      <span id="publish-status" role="status"></span>
      <div class="header-actions">
        <button id="publish">Publicar catalogo</button>
        <button id="save">Salvar escolhas</button>
      </div>
    </section>

    <main>
      <aside>
        <input id="search" type="search" placeholder="Buscar codigo ou produto" />
        <label><input id="missing" type="checkbox" /> Apenas sem foto</label>
        <nav id="list"></nav>
      </aside>
      <section id="editor">
        <p class="empty">Selecione um produto.</p>
      </section>
    </main>

    <section class="dashboard" id="dashboard" aria-label="Painel operacional">
      <div class="dashboard-head">
        <div>
          <p>Painel</p>
          <h2>Resumo operacional e financeiro</h2>
        </div>
        <button id="refresh-dashboard">Atualizar painel</button>
      </div>
      <div class="dashboard-grid" id="dashboard-grid">
        <p class="empty">Carregando painel.</p>
      </div>
    </section>

    <script src="/admin/photos.js" type="module"></script>
  </body>
</html>
